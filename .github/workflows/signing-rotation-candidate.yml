name: Build signing rotation candidate

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/signing-rotation-candidate.yml"

permissions:
  contents: read

jobs:
  rotation-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      OLD_SIGNER_SHA256: 90b075695287a8080bda9fcb4cd4dff188e781a25a1d135ddfeeed85f1a09da1
      NEW_SIGNER_SHA256: da4ff75b61d65a3ff1c335bf87a2173c63bb031711faebfded2b965fb1c851b1
      QUIETLINK_SIGNING_STORE_PASSWORD: ${{ secrets.QUIETLINK_SIGNING_STORE_PASSWORD }}
      QUIETLINK_SIGNING_KEY_PASSWORD: ${{ secrets.QUIETLINK_SIGNING_KEY_PASSWORD }}
      QUIETLINK_SIGNING_KEY_ALIAS: ${{ secrets.QUIETLINK_SIGNING_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Require v2 signing secrets
        env:
          QUIETLINK_SIGNING_KEY_B64: ${{ secrets.QUIETLINK_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$QUIETLINK_SIGNING_KEY_B64"
          test -n "$QUIETLINK_SIGNING_STORE_PASSWORD"
          test -n "$QUIETLINK_SIGNING_KEY_PASSWORD"
          test -n "$QUIETLINK_SIGNING_KEY_ALIAS"
          printf '%s' "$QUIETLINK_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/quietlink-v2.p12"
          chmod 600 "$RUNNER_TEMP/quietlink-v2.p12"
          test -s "$RUNNER_TEMP/quietlink-v2.p12"
          echo "New signing material reconstructed in runner temp only."

      - name: Verify v2 certificate pin
        run: |
          set -euo pipefail
          ACTUAL="$(keytool -list -v             -keystore "$RUNNER_TEMP/quietlink-v2.p12"             -storetype PKCS12             -storepass "$QUIETLINK_SIGNING_STORE_PASSWORD"             -alias "$QUIETLINK_SIGNING_KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' |
            tr -d ':' |
            tr 'A-F' 'a-f' |
            head -n1)"
          test "$ACTUAL" = "$NEW_SIGNER_SHA256"
          echo "v2 certificate pin verified."

      - name: Build unsigned rotation candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s = re.sub(
              r'\n    signingConfigs \{.*?\n    \}\n\n    defaultConfig',
              '\n    defaultConfig',
              s,
              flags=re.S,
          )
          s = re.sub(
              r'\n[ \t]*signingConfig = signingConfigs\.getByName\("quietlinkDev"\)',
              '',
              s,
          )
          s = re.sub(r'versionCode = \d+', 'versionCode = 59', s)
          s = re.sub(
              r'versionName = "[^"]+"',
              'versionName = "0.3.47-rotation-test"',
              s,
          )
          if "quietlink-debug.jks" in s or "storePassword" in s or "keyPassword" in s:
              raise SystemExit("temporary unsigned Gradle config still contains old signing config")
          p.write_text(s, encoding="utf-8")
          PY
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create Android signing lineage
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" rotate             --out "$RUNNER_TEMP/quietlink-signing-lineage"             --old-signer               --ks app/quietlink-debug.jks               --ks-type PKCS12               --ks-key-alias quietlink               --ks-pass pass:quietlink-dev               --key-pass pass:quietlink-dev             --new-signer               --ks "$RUNNER_TEMP/quietlink-v2.p12"               --ks-type PKCS12               --ks-key-alias "$QUIETLINK_SIGNING_KEY_ALIAS"               --ks-pass env:QUIETLINK_SIGNING_STORE_PASSWORD               --key-pass env:QUIETLINK_SIGNING_KEY_PASSWORD
          test -s "$RUNNER_TEMP/quietlink-signing-lineage"
          echo "Old-to-v2 signing lineage created in runner temp only."

      - name: Sign rotation candidate
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OUT="$RUNNER_TEMP/QuietLink-v0.3.47-rotation-candidate.apk"
          "$APKSIGNER" sign             --ks app/quietlink-debug.jks             --ks-type PKCS12             --ks-key-alias quietlink             --ks-pass pass:quietlink-dev             --key-pass pass:quietlink-dev             --next-signer             --ks "$RUNNER_TEMP/quietlink-v2.p12"             --ks-type PKCS12             --ks-key-alias "$QUIETLINK_SIGNING_KEY_ALIAS"             --ks-pass env:QUIETLINK_SIGNING_STORE_PASSWORD             --key-pass env:QUIETLINK_SIGNING_KEY_PASSWORD             --lineage "$RUNNER_TEMP/quietlink-signing-lineage"             --rotation-min-sdk-version 28             --out "$OUT"             app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$OUT"

      - name: Verify candidate signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OUT="$RUNNER_TEMP/QuietLink-v0.3.47-rotation-candidate.apk"
          "$APKSIGNER" verify --min-sdk-version 28 --verbose --print-certs "$OUT"             | tee "$RUNNER_TEMP/apksigner-verification.txt"
          grep -qi "$NEW_SIGNER_SHA256" "$RUNNER_TEMP/apksigner-verification.txt"
          echo "Rotation candidate verifies for QuietLink minSdk 28 and contains v2 signer."

      - name: Verify future v2-only signing with retained lineage
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OUT="$RUNNER_TEMP/QuietLink-v0.3.47-v2-only-check.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/quietlink-v2.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$QUIETLINK_SIGNING_KEY_ALIAS" \
            --ks-pass env:QUIETLINK_SIGNING_STORE_PASSWORD \
            --key-pass env:QUIETLINK_SIGNING_KEY_PASSWORD \
            --lineage "$RUNNER_TEMP/quietlink-signing-lineage" \
            --rotation-min-sdk-version 28 \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --out "$OUT" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --min-sdk-version 28 --verbose --print-certs "$OUT" \
            | tee "$RUNNER_TEMP/v2-only-verification.txt"
          grep -qi "$NEW_SIGNER_SHA256" "$RUNNER_TEMP/v2-only-verification.txt"
          echo "Future v2-only signing with retained lineage verified."

      - name: Package rotation evidence
        run: |
          set -euo pipefail
          mkdir -p rotation-output
          cp "$RUNNER_TEMP/QuietLink-v0.3.47-rotation-candidate.apk" rotation-output/
          cp "$RUNNER_TEMP/QuietLink-v0.3.47-v2-only-check.apk" rotation-output/
          cp "$RUNNER_TEMP/quietlink-signing-lineage" rotation-output/quietlink-signing-lineage
          cp "$RUNNER_TEMP/apksigner-verification.txt" rotation-output/
          cp "$RUNNER_TEMP/v2-only-verification.txt" rotation-output/
          {
            echo "Candidate only; not published to the QuietLink update feed."
            echo "The signing-lineage file is public metadata, not a private key."
            echo "Expected old signer: $OLD_SIGNER_SHA256"
            echo "Expected v2 signer: $NEW_SIGNER_SHA256"
            echo "rotation-min-sdk-version=28"
          } > rotation-output/README.txt

      - name: Remove private runner material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/quietlink-v2.p12"
          rm -f "$RUNNER_TEMP/quietlink-signing-lineage"

      - name: Upload rotation candidate
        uses: actions/upload-artifact@v4
        with:
          name: QuietLink-v0.3.47-signing-rotation-candidate
          path: rotation-output/
          if-no-files-found: error
